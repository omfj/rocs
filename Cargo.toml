[package]
name = "rocs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures = "0.3.32"
notify = "8.2.0"
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = "0.13.4"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
